<style>
  #carouselOverlay {
    background-color: rgba(0, 0, 0, 0.5);
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    z-index: 1;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: "Montserrat", monospace;
  }
  #carouselOverlay h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 3.8rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
  }
</style>
<div id="carousel" class="carousel slide" style="height: 50vh; position: relative;">
  <div id="carouselOverlay">
    <h1>Next Sing</h1>
    <p>MIT's low-commitment, beginner-friendly acapella group</p>
    <p>Based in Next House, open to all!</p>
  </div>
  <div class="carousel-inner" style="height: 100%;">
    {% assign image_files = site.static_files | where: "slide", true %}
    {% for image in image_files %}
      <div class="carousel-item
      {% if forloop.index0 == 0 %}
        active
      {% endif %}
      " style="height: 100%;">
        <img class="d-block w-100"
        {% if forloop.index0 == 0 %}
          src="{{ image.path | relative_url }}"
        {% else %}
          data-src="{{ image.path | relative_url }}"
        {% endif %}
        alt="Next Sing Photo {{ forloop.index0 }}" style="object-fit: cover; height: 100%;">
      </div>
    {% endfor %}
    <a class="carousel-control-prev" href="#carousel" role="button" data-slide="prev" style="margin: 100px 0;">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#carousel" role="button" data-slide="next" style="margin: 100px 0;">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>
<script>
  //lazy loading: only load images in the carousel if they're right before or after the current slide
  $(() => {
    function loadSlideImage($slide) {
      if (!$slide || !$slide.length) return;
      let $lazy = $slide.find('img[data-src]');
      $lazy.attr('src', $lazy.data('src'));
      $lazy.removeAttr('data-src');
    }

    // upon page load, immediately load last and second images
    loadSlideImage($('#carousel .carousel-item').eq(1));
    loadSlideImage($('#carousel .carousel-item').eq(-1));

    // every time a slide is flipped, preload the next and previous slides
    $('#carousel').on('slid.bs.carousel', (ev) => {
      let $active = $(ev.relatedTarget)
      let $carousel = $(ev.delegateTarget)

      // Get next and previous slide elements
      let $next = $active.next('.carousel-item');
      if (!$next.length) $next = $carousel.find('.carousel-item').first(); // Wrap around

      let $prev = $active.prev('.carousel-item');
      if (!$prev.length) $prev = $carousel.find('.carousel-item').last();  // Wrap around

      // Preload next and previous slide in the background
      loadSlideImage($next);
      loadSlideImage($prev);
    });
  })
</script>
